<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Inter',Arial,sans-serif;
    background:linear-gradient(135deg, #0d1b2a 0%, #0f2044 100%);
    position:relative;
    width:1200px; height:630px;
  }
  /* decorative network-node accent, top right, matches og-image.svg */
  .node { position:absolute; width:4px; height:4px; border-radius:50%; background:#00c4a7; opacity:0.3; }
  .brand {
    position:absolute; top:64px; left:80px;
    display:flex; align-items:center; gap:14px;
  }
  .brand-ring {
    width:52px; height:52px; border-radius:50%;
    border:1.5px solid rgba(0,196,167,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
  }
  .brand-name { font-size:30px; font-weight:800; color:#ffffff; letter-spacing:-0.3px; }
  .brand-name .accent { color:#00c4a7; }
  .pill {
    position:absolute; top:150px; left:80px;
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(0,196,167,0.15); border:1px solid rgba(0,196,167,0.5);
    border-radius:99px; padding:8px 20px;
    font-size:16px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase;
    color:#5eead4;
  }
  .title {
    position:absolute; left:80px; right:80px; top:225px;
    font-family:'DM Serif Display',Georgia,serif;
    font-size:56px; font-weight:400; line-height:1.18;
    color:#ffffff;
  }
  .subtitle {
    position:absolute; left:80px; right:100px; top:340px;
    font-family:'DM Serif Display',Georgia,serif;
    font-style:italic; font-size:32px; line-height:1.3;
    color:#5eead4;
  }
  .footer {
    position:absolute; bottom:56px; left:80px;
    display:flex; align-items:center; gap:14px;
  }
  .footer-domain { font-size:20px; color:#93a3b8; letter-spacing:0.2px; }
  .footer-rule { width:56px; height:3px; background:#00c4a7; border-radius:2px; }
</style>
</head>
<body>
  <div class="node" style="top:90px; left:1040px;"></div>
  <div class="node" style="top:160px; left:1120px;"></div>
  <div class="node" style="top:230px; left:980px;"></div>
  <div class="node" style="top:300px; left:1100px;"></div>

  <div class="brand">
    <div class="brand-ring">🧭</div>
    <div class="brand-name">FinCrime<span class="accent">Radar</span></div>
  </div>

  {{SERIES_PILL}}

  <div class="title" id="cardTitle">{{TITLE}}</div>
  <div class="subtitle" id="cardSubtitle">{{SUBTITLE}}</div>

  <div class="footer">
    <div class="footer-rule"></div>
    <div class="footer-domain">fincrimeradar.org</div>
  </div>
</body>
</html>
